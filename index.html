<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kassenbelege</title>
<style>
  :root {
    --accent: #bd0010;
    --border: #d7dce3;
    --bg: #f7f8fa;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #b3261e;
    --ok: #2e7d32;
    --card-bg: #fff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  #toolbar {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--card-bg);
  }
  #toolbar h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #toolbar-actions { display: flex; gap: 8px; }

  #file-input { display: none; }

  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }

  .btn-secondary {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-secondary:disabled { opacity: 0.5; cursor: default; }
  .btn-secondary:hover:not(:disabled) { background: var(--bg); }

  /* Feste 50/50-Aufteilung statt seitenverhaeltnis-abhaengiger Breite: auf grossen Bildschirmen
     bekommt die Vorschau dadurch reichlich Platz, und die Aufteilung aendert sich nicht mehr je
     nach ausgewaehltem Beleg (behebt auch den Spalten-Reflow der Liste von vorher). */
  #body { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 20px; overflow: hidden; }

  #list-pane { min-width: 0; overflow-y: auto; }
  /* Immer exakt 2 Spalten, auch wenn eine Kachel aufgeklappt ist - keine Spaltenzahl-Aenderung
     mehr beim Oeffnen (die aufgeklappte Kachel bleibt in ihrer normalen Rasterzelle, wird nur
     hoeher, nicht breiter). */
  /* align-items:start verhindert, dass eine kollabierte Kachel per Grid-Default (stretch) auf
     die Hoehe ihrer geoeffneten Nachbarkachel in derselben Zeile aufgeblaeht wird (leerer
     Weissraum darunter) - jede Kachel bleibt auf ihrer eigenen Inhaltshoehe. */
  #list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-content: start; align-items: start; }
  #list-empty { color: var(--muted); font-size: 13px; }

  /* Bewusst KEIN max-height auf der Pane selbst: die Hoehe darf ueber den sichtbaren Bereich
     hinauswachsen (lange Belege), overflow-y:auto laesst dann NUR die Vorschau scrollen, nicht
     die Liste. */
  #preview-pane {
    min-width: 0; overflow-y: auto; overflow-x: hidden;
    border: 1px solid var(--border); border-radius: 10px; background: #eceef1;
    padding: 10px;
  }
  #preview-pane.empty { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-align: center; }
  #preview-pane img, #preview-pane embed { width: 100%; height: auto; display: block; border: none; }

  .beleg-row {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px;
  }
  .beleg-row.open { border-color: var(--accent); }

  .row-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
  .row-header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .seq-badge {
    flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    color: #fff; font-weight: 600; font-size: 11.5px; display: flex; align-items: center; justify-content: center;
  }
  .row-filename { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .row-hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }

  .beleg-status { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; flex: none; }
  .status-analysiere, .status-sende { background: #eef1f5; color: var(--muted); }
  .status-pruefen { background: #fff4e5; color: #8a5300; }
  .status-angelegt { background: #e8f5e9; color: var(--ok); }
  .status-analyse_fehler, .status-anlegen_fehler { background: #fdecea; color: var(--danger); }

  .row-body { margin-top: 10px; }
  .field-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin-bottom: 7px; }
  .field-row label { color: var(--muted); font-size: 12px; }
  .field-row input, .field-row select {
    font-size: 13.5px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; width: 100%;
  }
  .field-row input:disabled, .field-row select:disabled { background: #f3f4f6; color: var(--muted); }

  .belegtyp-toggle { display: flex; gap: 14px; }
  .belegtyp-check { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; cursor: pointer; }
  .belegtyp-check input { width: auto; flex: none; cursor: pointer; }

  /* Adressfeld ist immer "offen" (kein Toggle mehr) - Icon zeigt den Bestaetigungsstatus
     (rotes X = noch keine Adresse gewaehlt, gruener Haken = bestaetigt), das Eingabefeld dient
     gleichzeitig als Suchfeld und als Anzeige der aktuellen Auswahl. */
  .addr-block {
    font-size: 13px; border: 1px solid var(--border); border-radius: 6px; padding: 6px;
    background: #fafbfc;
  }
  .addr-input-row { display: flex; align-items: center; gap: 6px; }
  .addr-icon { flex: none; width: 16px; text-align: center; font-weight: 700; font-size: 14px; }
  .addr-icon.no { color: var(--danger); }
  .addr-icon.yes { color: var(--ok); }
  .addr-search-input {
    flex: 1 1 auto; min-width: 0; font-size: 13px; padding: 5px 7px; border: 1px solid var(--border);
    border-radius: 5px; font-family: inherit;
  }
  .addr-search-results:not(:empty) { margin-top: 4px; }
  .addr-result {
    padding: 5px 7px; border-radius: 5px; cursor: pointer; font-size: 12.5px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .addr-result:hover { background: var(--bg); }
  .addr-result-tag { color: var(--muted); font-size: 11px; flex: none; }
  .addr-hint { color: var(--muted); font-size: 12px; padding: 4px 2px; }
  .addr-hint-new { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .addr-new-check { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text); cursor: pointer; white-space: nowrap; }
  .addr-new-check input { width: auto; flex: none; cursor: pointer; }

  .row-actions { margin-top: 10px; display: flex; align-items: center; gap: 10px; }

  .row-msg { font-size: 12.5px; margin-top: 8px; }
  .row-msg.err { color: var(--danger); }
  .row-msg.ok { color: var(--ok); }
  .confidence-low { color: #8a5300; font-size: 12.5px; margin-bottom: 8px; }

  #drag-overlay {
    position: fixed; inset: 0; border: 3px dashed var(--accent); background: rgba(189, 0, 16, .05);
    display: none; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
    color: var(--accent); z-index: 50; pointer-events: none;
  }
  body.dragging #drag-overlay { display: flex; }

  @media (max-width: 860px) {
    html, body { overflow: auto; }
    #body { grid-template-columns: 1fr; overflow: visible; }
    #list-pane { max-height: 38vh; }
    #list { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>Kassenbelege erfassen</h1>
    <div id="toolbar-actions">
      <button id="upload-btn" class="btn"
        title="Beleg (Foto oder PDF) hochladen - die Felder werden automatisch ausgelesen. Bitte vor dem Anlegen prüfen und ggf. korrigieren. JPG, PNG oder PDF, auch mehrere gleichzeitig.">
        Beleg hochladen
      </button>
    </div>
  </div>

  <div id="body">
    <div id="list-pane">
      <div id="list"></div>
    </div>
    <div id="preview-pane" class="empty">
      <div>Beleg auswählen, um die Vorschau zu sehen.</div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/jpeg,image/png,application/pdf" multiple>
  <div id="drag-overlay">Beleg hier ablegen</div>
</div>

<script>
  const BASE_URL = "https://cclcdhwnzkzciwjaclzt.supabase.co/functions/v1";
  const ANALYSE_URL = `${BASE_URL}/kasse-beleg-analysieren`;
  const ANLEGEN_URL = `${BASE_URL}/kasse-beleg-anlegen`;
  const ADRESSE_URL = `${BASE_URL}/kasse-adresse-suchen`;

  const fileInput = document.getElementById("file-input");
  const uploadBtn = document.getElementById("upload-btn");
  const list = document.getElementById("list");
  const previewPane = document.getElementById("preview-pane");

  let receipts = [];
  let openId = null;
  let idCounter = 0;
  let receiptCounter = 0;

  uploadBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => {
    handleFiles(e.target.files);
    fileInput.value = "";
  });
  let dragCounter = 0;
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("dragenter", (e) => {
    e.preventDefault();
    dragCounter++;
    document.body.classList.add("dragging");
  });
  document.addEventListener("dragleave", () => {
    dragCounter = Math.max(0, dragCounter - 1);
    if (dragCounter === 0) document.body.classList.remove("dragging");
  });
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    dragCounter = 0;
    document.body.classList.remove("dragging");
    handleFiles(e.dataTransfer.files);
  });

  function handleFiles(fileList) {
    for (const file of fileList) addReceipt(file);
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(String(reader.result).split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // Fotos werden im Browser auf eine vernuenftige Groesse herunterskaliert und als JPEG
  // re-encodiert (auch PNGs, wegen Transparenz auf weissem Hintergrund) - liefert dabei auch
  // gleich die Pixelmasse, die die Anlegen-Funktion zum Einbetten ins PDF braucht und die die
  // Vorschau zur Berechnung ihres Seitenverhaeltnisses nutzt.
  function imageFileToJpeg(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const maxDim = 2000;
        let { width, height } = img;
        if (Math.max(width, height) > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(
          (blob) => {
            URL.revokeObjectURL(url);
            if (!blob) return reject(new Error("Konnte Bild nicht konvertieren."));
            resolve({ blob, width, height });
          },
          "image/jpeg",
          0.85,
        );
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error("Datei konnte nicht als Bild gelesen werden."));
      };
      img.src = url;
    });
  }

  // Liest die Seitengroesse (MediaBox) direkt aus dem PDF-Bytestream - kein PDF-Parser noetig,
  // da der MediaBox-Eintrag bei den ueblichen einseitigen Scan-PDFs als reiner ASCII-Text im
  // Objektverzeichnis steht und daher auch nach einer latin1-Dekodierung des gesamten (teils
  // binaeren) Dateiinhalts unversehrt auffindbar ist. Liefert null, wenn nichts gefunden wird -
  // der Aufrufer faellt dann auf ein Standard-Seitenverhaeltnis zurueck.
  async function extractPdfPageSize(file) {
    try {
      const buf = await file.arrayBuffer();
      const text = new TextDecoder("latin1").decode(buf);
      const m = text.match(/\/MediaBox\s*\[\s*([\d.+-]+)\s+([\d.+-]+)\s+([\d.+-]+)\s+([\d.+-]+)\s*\]/);
      if (!m) return null;
      const width = Math.abs(parseFloat(m[3]) - parseFloat(m[1]));
      const height = Math.abs(parseFloat(m[4]) - parseFloat(m[2]));
      if (!width || !height) return null;
      return { width, height };
    } catch {
      return null;
    }
  }

  async function prepareFile(file) {
    if (file.type === "application/pdf") {
      const fileBase64 = await blobToBase64(file);
      const size = (await extractPdfPageSize(file)) || { width: 210, height: 297 };
      return {
        mimeType: "application/pdf",
        fileBase64,
        width: null,
        height: null,
        previewUrl: URL.createObjectURL(file),
        previewAspect: size.width / size.height,
      };
    }
    const { blob, width, height } = await imageFileToJpeg(file);
    const fileBase64 = await blobToBase64(blob);
    return {
      mimeType: "image/jpeg",
      fileBase64,
      width,
      height,
      previewUrl: URL.createObjectURL(blob),
      previewAspect: width / height,
    };
  }

  function euro(n) {
    return Number(n).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fieldRowHtml(id, label, field, inputHtml) {
    return `<div class="field-row"><label>${label}</label>${inputHtml}</div>`;
  }

  function addReceipt(file) {
    const r = {
      id: "r" + ++idCounter,
      seq: ++receiptCounter,
      file,
      status: "analysiere",
      prepared: null,
      previewUrl: null,
      previewAspect: null,
      buchungskontenOptionen: [],
      confidence: null,
      addrSearchQuery: "",
      addrSearchResults: [],
      fields: {
        aussteller: "", datum: "", betrag: "", art: "expense", belegtyp: "kassenbeleg",
        belegnummer: "", kurzbeschreibung: "", buchungskonto_nr: null,
        iban: null, bic: null, strasse: null, plz: null, ort: null,
        contactOverrideId: null, contactOverrideName: null, addrCreateNew: false,
      },
      message: null,
      result: null,
    };
    receipts.push(r);
    renderList();
    runPipeline(r);
  }

  async function runPipeline(r) {
    try {
      const prepared = await prepareFile(r.file);
      r.prepared = prepared;
      r.previewUrl = prepared.previewUrl;
      r.previewAspect = prepared.previewAspect;
      if (openId === r.id) renderPreview();
    } catch (e) {
      r.status = "analyse_fehler";
      r.message = { type: "err", text: `Datei konnte nicht verarbeitet werden: ${e.message}` };
      renderList();
      return;
    }

    try {
      const resp = await fetch(ANALYSE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mimeType: r.prepared.mimeType, fileBase64: r.prepared.fileBase64 }),
      });
      const analyse = await resp.json();
      if (!resp.ok) throw new Error(analyse.error || `Fehler ${resp.status}`);
      r.status = "pruefen";
      r.buchungskontenOptionen = analyse.buchungskonten_optionen || [];
      r.confidence = analyse.confidence || "medium";
      r.fields = {
        aussteller: analyse.aussteller || "",
        datum: analyse.datum || "",
        betrag: analyse.betrag ?? "",
        art: analyse.art === "revenue" ? "revenue" : "expense",
        belegtyp: analyse.belegtyp === "rechnung" ? "rechnung" : "kassenbeleg",
        belegnummer: analyse.belegnummer || "",
        kurzbeschreibung: analyse.kurzbeschreibung || "",
        buchungskonto_nr: analyse.buchungskonto ? analyse.buchungskonto.nr : (r.buchungskontenOptionen[0] ? r.buchungskontenOptionen[0].nr : null),
        iban: analyse.iban || null,
        bic: analyse.bic || null,
        strasse: analyse.strasse || null,
        plz: analyse.plz || null,
        ort: analyse.ort || null,
        contactOverrideId: null,
        contactOverrideName: null,
        addrCreateNew: false,
      };
      // Das Adressfeld ist immer offen (kein Toggle mehr, der die Suche anstoesst) - deshalb hier
      // direkt mit dem erkannten Aussteller als Suchbegriff starten, wenn es sich um eine Rechnung
      // handelt.
      if (r.fields.belegtyp === "rechnung") {
        r.addrSearchQuery = r.fields.aussteller || "";
        performAddressSearch(r, r.addrSearchQuery);
      }
    } catch (e) {
      r.status = "analyse_fehler";
      r.message = { type: "err", text: `Analyse fehlgeschlagen: ${e.message}` };
    }
    renderList();
  }

  async function submitAnlegen(r) {
    r.status = "sende";
    r.message = null;
    renderList();

    const payload = {
      dateiname: r.file.name,
      mimeType: r.prepared.mimeType,
      fileBase64: r.prepared.fileBase64,
      width: r.prepared.width,
      height: r.prepared.height,
      aussteller: r.fields.aussteller,
      datum: r.fields.datum,
      betrag: parseFloat(r.fields.betrag),
      art: r.fields.art,
      belegtyp: r.fields.belegtyp,
      belegnummer: r.fields.belegnummer,
      kurzbeschreibung: r.fields.kurzbeschreibung,
      buchungskonto_nr: parseInt(r.fields.buchungskonto_nr, 10),
      iban: r.fields.iban || null,
      bic: r.fields.bic || null,
      strasse: r.fields.strasse || null,
      plz: r.fields.plz || null,
      ort: r.fields.ort || null,
      contact_override_id: r.fields.contactOverrideId || null,
      contact_override_name: r.fields.contactOverrideName || null,
    };

    try {
      const resp = await fetch(ANLEGEN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || `Fehler ${resp.status}`);
      r.status = "angelegt";
      r.result = result;
    } catch (e) {
      r.status = "anlegen_fehler";
      r.message = { type: "err", text: `Anlegen fehlgeschlagen: ${e.message}` };
    }
    renderList();
  }

  function toggleOpen(id) {
    openId = openId === id ? null : id;
    renderList();
    renderPreview();
  }

  // Entfernt einen fertig angelegten Beleg aus der Liste (nur aus der App, nicht aus
  // Easyverein - der Beleg ist dort ja bereits erfolgreich angelegt und bleibt bestehen).
  function removeReceipt(id) {
    const r = receipts.find((x) => x.id === id);
    if (r && r.previewUrl) URL.revokeObjectURL(r.previewUrl);
    receipts = receipts.filter((x) => x.id !== id);
    if (openId === id) openId = null;
    renderList();
    renderPreview();
  }

  function statusPillHtml(status) {
    const map = {
      analysiere: "Analysiere …",
      pruefen: "Bitte prüfen",
      sende: "Wird angelegt …",
      angelegt: "Angelegt",
      analyse_fehler: "Fehler",
      anlegen_fehler: "Fehler",
    };
    return `<span class="beleg-status status-${status}">${map[status] || status}</span>`;
  }

  // Adressfeld ("Zahlung an") - immer als offenes Suchfeld dargestellt, kein Toggle mehr:
  // ueber die Trefferliste kann der Nutzer entweder die automatisch erkannte Adresse bestaetigen
  // oder stattdessen z.B. ein Mitglied waehlen (etwa wenn eine Rechnung bereits privat verauslagt
  // wurde und die Erstattung an das Mitglied statt an den Lieferanten gehen soll). Das rote "X"
  // bzw. der gruene Haken vor dem Feld zeigt nur, ob die Zahlungsadresse aktiv bestaetigt wurde -
  // entweder per Klick in der Trefferliste, oder (wenn es "Keine Treffer" gibt) per Haekchen bei
  // "neu anlegen". Tippen im Feld hebt eine Bestaetigung wieder auf (siehe input-Listener), das
  // Leeren des Felds entspricht damit gedanklich einem Zuruecksetzen. Solange nichts bestaetigt
  // ist, bleibt der "Beleg anlegen"-Schalter gesperrt (siehe rowBodyHtml) - so wird nie versehentlich
  // ohne bewusste Zahlungsziel-Entscheidung angelegt.
  function isAddressConfirmed(r) {
    return !!(r.fields.contactOverrideId || r.fields.addrCreateNew);
  }

  function addressResultsHtml(r) {
    const results = r.addrSearchResults;
    if (results && results.length > 0) {
      return results
        .map(
          (c) => `
        <div class="addr-result" data-action="addr-select" data-contact-id="${c.id}" data-contact-name="${esc(c.name)}">
          <span>${esc(c.name)}${c.ort ? " · " + esc(c.ort) : ""}</span>
          <span class="addr-result-tag">${c.istMitglied ? "Mitglied" : ""}</span>
        </div>`,
        )
        .join("");
    }
    if (r.addrSearchQuery.trim().length < 2) {
      return `<div class="addr-hint">Mindestens 2 Zeichen eingeben …</div>`;
    }
    return `<div class="addr-hint addr-hint-new">
        <span>Keine Treffer.</span>
        <label class="addr-new-check">
          <input type="checkbox" data-addr-create-new ${r.fields.addrCreateNew ? "checked" : ""}>
          neu anlegen
        </label>
      </div>`;
  }

  function addressFieldHtml(r, disabled) {
    const confirmed = isAddressConfirmed(r);
    const icon = confirmed
      ? `<span class="addr-icon yes" title="Adresse bestätigt">✓</span>`
      : `<span class="addr-icon no" title="Noch keine Adresse bestätigt">✕</span>`;
    const value = r.fields.contactOverrideId ? r.fields.contactOverrideName : r.addrSearchQuery;
    return `<div class="addr-block">
        <div class="addr-input-row">
          ${icon}
          <input type="text" class="addr-search-input" placeholder="Name eingeben (Mitglied oder Firma) …" value="${esc(value)}" ${disabled ? "disabled" : ""}>
        </div>
        <div class="addr-search-results">${addressResultsHtml(r)}</div>
      </div>`;
  }

  async function performAddressSearch(r, query) {
    if (!query || query.trim().length < 2) {
      r.addrSearchResults = [];
    } else {
      try {
        const resp = await fetch(ADRESSE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: query.trim() }),
        });
        const data = await resp.json();
        r.addrSearchResults = resp.ok ? (data.results || []) : [];
      } catch {
        r.addrSearchResults = [];
      }
    }
    // Nur den Ergebnis-Container aktualisieren, nicht renderList() - sonst verliert das
    // Sucheingabefeld beim Tippen den Fokus.
    const row = list.querySelector(`.beleg-row[data-id="${r.id}"]`);
    const container = row && row.querySelector(".addr-search-results");
    if (container) container.innerHTML = addressResultsHtml(r);
  }

  function rowBodyHtml(r) {
    const disabled = r.status === "sende" || r.status === "angelegt";
    const confidenceNote = r.confidence === "low"
      ? `<div class="confidence-low">Erkennung unsicher - Datum und Betrag bitte besonders genau prüfen.</div>`
      : "";

    if (r.status === "analyse_fehler") {
      return `<div class="row-body"><div class="row-msg err">${esc(r.message?.text || "Analyse fehlgeschlagen.")}</div></div>`;
    }

    const optionsHtml = r.buchungskontenOptionen
      .map((k) => `<option value="${k.nr}" ${k.nr === r.fields.buchungskonto_nr ? "selected" : ""}>${esc(k.name)} (${k.nr})</option>`)
      .join("");

    const fields = `
      ${fieldRowHtml(r.id, "Aussteller", "aussteller", `<input type="text" data-id="${r.id}" data-field="aussteller" value="${esc(r.fields.aussteller)}" ${disabled ? "disabled" : ""}>`)}
      ${r.fields.belegtyp === "rechnung" ? fieldRowHtml(r.id, "Zahlung an", "adresse", addressFieldHtml(r, disabled)) : ""}
      ${fieldRowHtml(r.id, "Datum", "datum", `<input type="date" data-id="${r.id}" data-field="datum" value="${esc(r.fields.datum)}" ${disabled ? "disabled" : ""}>`)}
      ${fieldRowHtml(r.id, "Betrag (€)", "betrag", `<input type="number" step="0.01" min="0.01" data-id="${r.id}" data-field="betrag" value="${esc(r.fields.betrag)}" ${disabled ? "disabled" : ""}>`)}
      ${fieldRowHtml(r.id, "Art", "art", `<select data-id="${r.id}" data-field="art" ${disabled ? "disabled" : ""}>
          <option value="expense" ${r.fields.art !== "revenue" ? "selected" : ""}>Ausgabe</option>
          <option value="revenue" ${r.fields.art === "revenue" ? "selected" : ""}>Einnahme</option>
        </select>`)}
      ${fieldRowHtml(r.id, "Beleg-Typ", "belegtyp", `<div class="belegtyp-toggle">
          <label class="belegtyp-check"><input type="checkbox" data-id="${r.id}" data-belegtyp="kassenbeleg" ${r.fields.belegtyp !== "rechnung" ? "checked" : ""} ${disabled ? "disabled" : ""}> Kassenbeleg</label>
          <label class="belegtyp-check"><input type="checkbox" data-id="${r.id}" data-belegtyp="rechnung" ${r.fields.belegtyp === "rechnung" ? "checked" : ""} ${disabled ? "disabled" : ""}> Rechnung</label>
        </div>`)}
      ${fieldRowHtml(r.id, "Belegnummer", "belegnummer", `<input type="text" data-id="${r.id}" data-field="belegnummer" value="${esc(r.fields.belegnummer)}" placeholder="wird sonst automatisch vergeben" ${disabled ? "disabled" : ""}>`)}
      ${fieldRowHtml(r.id, "Beschreibung", "kurzbeschreibung", `<input type="text" data-id="${r.id}" data-field="kurzbeschreibung" value="${esc(r.fields.kurzbeschreibung)}" ${disabled ? "disabled" : ""}>`)}
      ${fieldRowHtml(r.id, "Buchungskonto", "buchungskonto_nr", `<select data-id="${r.id}" data-field="buchungskonto_nr" ${disabled ? "disabled" : ""}>${optionsHtml}</select>`)}
    `;

    const anlegenLabel = r.fields.belegtyp === "rechnung" ? "Beleg anlegen" : "Beleg + Buchung anlegen";
    // Bei Rechnungen ist "Beleg anlegen" gesperrt, solange die Zahlungsadresse nicht bestaetigt
    // ist (rotes X) - erst nach Bestaetigung (gruener Haken, per Trefferauswahl oder "neu anlegen")
    // wird der Schalter aktiv. Bei Kassenbelegen gibt es kein Adressfeld, daher keine Sperre.
    const anlegenGesperrt = r.fields.belegtyp === "rechnung" && !isAddressConfirmed(r);
    let actions = "";
    if (r.status === "pruefen") {
      actions = `<div class="row-actions"><button class="btn" data-action="anlegen" ${anlegenGesperrt ? "disabled" : ""}>${anlegenLabel}</button></div>`;
    } else if (r.status === "sende") {
      actions = `<div class="row-actions"><button class="btn" disabled>Lege an …</button></div>`;
    } else if (r.status === "anlegen_fehler") {
      actions = `<div class="row-actions"><button class="btn" data-action="anlegen">Erneut versuchen</button></div>`;
    } else if (r.status === "angelegt") {
      actions = `<div class="row-actions"><button class="btn-secondary" data-action="schliessen">Schließen</button></div>`;
    }

    let message = "";
    if (r.status === "angelegt" && r.result && r.result.belegtyp === "rechnung") {
      message = `<div class="row-msg ok">Beleg (Invoice ${r.result.easyverein_invoice_id}) in Easyverein angelegt (nur Beleg, keine Buchung - Rechnung mit Zahlungsziel).</div>`;
    } else if (r.status === "angelegt" && r.result) {
      message = `<div class="row-msg ok">Beleg (Invoice ${r.result.easyverein_invoice_id}) und Buchung (${euro(r.result.betrag)} € auf "${esc(r.result.buchungskonto)}") in Easyverein angelegt.</div>`;
    } else if (r.message) {
      message = `<div class="row-msg ${r.message.type}">${esc(r.message.text)}</div>`;
    }

    return `<div class="row-body">${confidenceNote}${fields}${actions}${message}</div>`;
  }

  function renderList() {
    if (receipts.length === 0) {
      list.innerHTML = `<div id="list-empty">Noch keine Belege hochgeladen.</div>`;
      return;
    }
    list.innerHTML = receipts
      .map((r) => {
        const open = r.id === openId;
        const hint = r.status === "analysiere"
          ? `<div class="row-hint">Beleg wird gelesen und an Claude zur Analyse geschickt.</div>`
          : "";
        return `
          <div class="beleg-row ${open ? "open" : ""}" data-id="${r.id}">
            <div class="row-header">
              <div class="row-header-left">
                <span class="seq-badge">${r.seq}</span>
                <span class="row-filename">${esc(r.file.name)}</span>
              </div>
              ${statusPillHtml(r.status)}
            </div>
            ${open ? rowBodyHtml(r) : hint}
          </div>
        `;
      })
      .join("");
  }

  // Die Pane-Breite ist jetzt fest 50% (siehe #body-Grid) statt vom Seitenverhaeltnis abhaengig -
  // die Breite des Mediums selbst folgt einfach width:100% der Pane (CSS). Nur die Hoehe ergibt
  // sich aus dem Seitenverhaeltnis (aspect-ratio) und darf beliebig lang werden - die Pane
  // scrollt dafuer eigenstaendig, unabhaengig von der Liste.
  function renderPreview() {
    const r = receipts.find((x) => x.id === openId);
    if (!r || !r.previewUrl) {
      previewPane.classList.add("empty");
      previewPane.innerHTML = `<div>Beleg auswählen, um die Vorschau zu sehen.</div>`;
      return;
    }
    previewPane.classList.remove("empty");
    const aspect = r.previewAspect || 0.71;
    const style = `aspect-ratio:${aspect};`;
    if (r.prepared && r.prepared.mimeType === "application/pdf") {
      previewPane.innerHTML = `<embed type="application/pdf" src="${r.previewUrl}" style="${style}">`;
    } else {
      previewPane.innerHTML = `<img src="${r.previewUrl}" style="${style}" alt="Beleg-Vorschau">`;
    }
  }

  list.addEventListener("click", (e) => {
    const actionEl = e.target.closest("[data-action]");
    if (actionEl) {
      const row = actionEl.closest(".beleg-row");
      const r = receipts.find((x) => x.id === row.dataset.id);
      if (actionEl.dataset.action === "anlegen" && r) submitAnlegen(r);
      if (actionEl.dataset.action === "schliessen") removeReceipt(row.dataset.id);
      if (actionEl.dataset.action === "addr-select" && r) {
        r.fields.contactOverrideId = actionEl.dataset.contactId;
        r.fields.contactOverrideName = actionEl.dataset.contactName;
        r.addrSearchQuery = actionEl.dataset.contactName;
        renderList();
      }
      return;
    }
    const header = e.target.closest(".row-header");
    if (header) {
      const row = header.closest(".beleg-row");
      toggleOpen(row.dataset.id);
    }
  });

  list.addEventListener("input", (e) => {
    const el = e.target;
    const row = el.closest(".beleg-row");
    const r = row && receipts.find((x) => x.id === row.dataset.id);
    if (!r) return;

    if (el.classList.contains("addr-search-input")) {
      // Tippen hebt eine zuvor bestaetigte Adresse (Trefferauswahl oder "neu anlegen") wieder auf
      // (das Aendern des Namens entspricht gedanklich einem Zuruecksetzen) - dafuer wird nur das
      // Icon gezielt aktualisiert, nicht renderList() aufgerufen, sonst verliert das Feld beim
      // Tippen den Fokus.
      if (isAddressConfirmed(r)) {
        r.fields.contactOverrideId = null;
        r.fields.contactOverrideName = null;
        r.fields.addrCreateNew = false;
        const icon = row.querySelector(".addr-icon");
        if (icon) {
          icon.className = "addr-icon no";
          icon.textContent = "✕";
          icon.title = "Noch keine Adresse bestätigt";
        }
        const anlegenBtn = row.querySelector('[data-action="anlegen"]');
        if (anlegenBtn) anlegenBtn.disabled = true;
      }
      // Debounced Live-Suche - aktualisiert bewusst nur den Ergebnis-Container (siehe
      // performAddressSearch), kein renderList() hier, sonst verliert das Feld beim Tippen
      // den Fokus.
      r.addrSearchQuery = el.value;
      clearTimeout(r._searchTimer);
      r._searchTimer = setTimeout(() => performAddressSearch(r, el.value), 400);
      return;
    }

    if (!el.dataset.field) return;
    r.fields[el.dataset.field] = el.value;
  });

  // Eigener change-Listener fuer "Beleg-Typ": im Gegensatz zu den uebrigen Feldern (die nur
  // lose in r.fields geschrieben werden, siehe oben) haengt hiervon die sichtbare Button-
  // Beschriftung ab ("Beleg + Buchung anlegen" vs. "Nur Beleg anlegen") - braucht deshalb ein
  // Neu-Rendern. Kein Fokusverlust-Risiko, da es ein Auswahlfeld ist, kein Text-Eingabefeld.
  list.addEventListener("change", (e) => {
    const el = e.target;
    const row = el.closest(".beleg-row");
    const r = row && receipts.find((x) => x.id === row.dataset.id);

    if (r && el.hasAttribute("data-addr-create-new")) {
      // "neu anlegen" ist die Bestaetigung fuer den Fall "Keine Treffer" - zaehlt genauso als
      // bestaetigte Zahlungsadresse wie eine Trefferauswahl (siehe isAddressConfirmed) und
      // schaltet damit den "Beleg anlegen"-Schalter frei.
      r.fields.addrCreateNew = el.checked;
      renderList();
      return;
    }

    if (!el.dataset.belegtyp) return;
    if (r && el.checked) {
      // Nur auf ein Ankreuzen reagieren, nicht auf ein Abwaehlen - so bleibt immer genau einer
      // der beiden Belegtypen aktiv (wie bei Radiobuttons), obwohl es technisch zwei
      // unabhaengige Checkboxen sind (auf Nutzerwunsch statt Dropdown, fuer schnellere Bedienung).
      r.fields.belegtyp = el.dataset.belegtyp;
      // Adressfeld ist immer offen - beim erstmaligen Umschalten auf "Rechnung" direkt mit dem
      // Aussteller als Suchbegriff starten.
      if (r.fields.belegtyp === "rechnung" && !r.addrSearchQuery) {
        r.addrSearchQuery = r.fields.aussteller || "";
        performAddressSearch(r, r.addrSearchQuery);
      }
    }
    renderList();
  });

  renderList();
  renderPreview();
</script>
</body>
</html>
