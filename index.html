<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kassenbelege</title>
<style>
  :root {
    --accent: #bd0010;
    --border: #d7dce3;
    --bg: #f7f8fa;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #b3261e;
    --ok: #2e7d32;
    --card-bg: #fff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  #toolbar {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--card-bg);
  }
  #toolbar h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #toolbar-actions { display: flex; gap: 8px; }

  #file-input { display: none; }

  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }

  .btn-secondary {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-secondary:disabled { opacity: 0.5; cursor: default; }
  .btn-secondary:hover:not(:disabled) { background: var(--bg); }

  #body { flex: 1 1 auto; display: flex; gap: 16px; padding: 16px 20px; overflow: hidden; }

  #list-pane { flex: 1 1 auto; min-width: 0; overflow-y: auto; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; align-content: start; }
  #list-empty { color: var(--muted); font-size: 13px; }

  #preview-pane {
    flex: 0 0 auto; max-width: 55%; min-width: 220px; overflow: auto;
    border: 1px solid var(--border); border-radius: 10px; background: #eceef1;
    display: flex; align-items: center; justify-content: center; padding: 10px;
  }
  #preview-pane.empty { color: var(--muted); font-size: 13px; text-align: center; }
  #preview-pane img, #preview-pane embed { max-width: 100%; width: auto; height: auto; display: block; border: none; }

  .beleg-row {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px;
  }
  .beleg-row.open { grid-column: 1 / -1; border-color: var(--accent); }

  .row-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
  .row-header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .seq-badge {
    flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    color: #fff; font-weight: 600; font-size: 11.5px; display: flex; align-items: center; justify-content: center;
  }
  .row-filename { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .row-hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }

  .beleg-status { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; flex: none; }
  .status-analysiere, .status-sende { background: #eef1f5; color: var(--muted); }
  .status-pruefen { background: #fff4e5; color: #8a5300; }
  .status-angelegt { background: #e8f5e9; color: var(--ok); }
  .status-analyse_fehler, .status-anlegen_fehler { background: #fdecea; color: var(--danger); }

  .row-body { margin-top: 10px; }
  .field-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin-bottom: 7px; }
  .field-row label { color: var(--muted); font-size: 12px; }
  .field-row input, .field-row select {
    font-size: 13.5px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; width: 100%;
  }
  .field-row input:disabled, .field-row select:disabled { background: #f3f4f6; color: var(--muted); }

  .row-actions { margin-top: 10px; display: flex; align-items: center; gap: 10px; }

  .row-msg { font-size: 12.5px; margin-top: 8px; }
  .row-msg.err { color: var(--danger); }
  .row-msg.ok { color: var(--ok); }
  .confidence-low { color: #8a5300; font-size: 12.5px; margin-bottom: 8px; }

  #drag-overlay {
    position: fixed; inset: 0; border: 3px dashed var(--accent); background: rgba(189, 0, 16, .05);
    display: none; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
    color: var(--accent); z-index: 50; pointer-events: none;
  }
  body.dragging #drag-overlay { display: flex; }

  @media (max-width: 860px) {
    html, body { overflow: auto; }
    #body { flex-direction: column; overflow: visible; }
    #list-pane { max-height: 38vh; }
    #preview-pane { max-width: 100%; width: 100%; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>Kassenbelege erfassen</h1>
    <div id="toolbar-actions">
      <button id="anlegen-alle-btn" class="btn-secondary" disabled>Alles anlegen</button>
      <button id="upload-btn" class="btn"
        title="Beleg (Foto oder PDF) hochladen - die Felder werden automatisch ausgelesen. Bitte vor dem Anlegen prüfen und ggf. korrigieren. JPG, PNG oder PDF, auch mehrere gleichzeitig.">
        Beleg hochladen
      </button>
    </div>
  </div>

  <div id="body">
    <div id="list-pane">
      <div id="list"></div>
    </div>
    <div id="preview-pane" class="empty">
      <div>Beleg auswählen, um die Vorschau zu sehen.</div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/jpeg,image/png,application/pdf" multiple>
  <div id="drag-overlay">Beleg hier ablegen</div>
</div>

<script>
  const BASE_URL = "https://cclcdhwnzkzciwjaclzt.supabase.co/functions/v1";
  const ANALYSE_URL = `${BASE_URL}/kasse-beleg-analysieren`;
  const ANLEGEN_URL = `${BASE_URL}/kasse-beleg-anlegen`;

  const fileInput = document.getElementById("file-input");
  const uploadBtn = document.getElementById("upload-btn");
  const anlegenAlleBtn = document.getElementById("anlegen-alle-btn");
  const list = document.getElementById("list");
  const previewPane = document.getElementById("preview-pane");

  let receipts = [];
  let openId = null;
  let idCounter = 0;
  let receiptCounter = 0;

  uploadBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => {
    handleFiles(e.target.files);
    fileInput.value = "";
  });
  anlegenAlleBtn.addEventListener("click", anlegenAlle);

  let dragCounter = 0;
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("dragenter", (e) => {
    e.preventDefault();
    dragCounter++;
    document.body.classList.add("dragging");
  });
  document.addEventListener("dragleave", () => {
    dragCounter = Math.max(0, dragCounter - 1);
    if (dragCounter === 0) document.body.classList.remove("dragging");
  });
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    dragCounter = 0;
    document.body.classList.remove("dragging");
    handleFiles(e.dataTransfer.files);
  });

  function handleFiles(fileList) {
    for (const file of fileList) addReceipt(file);
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(String(reader.result).split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // Fotos werden im Browser auf eine vernuenftige Groesse herunterskaliert und als JPEG
  // re-encodiert (auch PNGs, wegen Transparenz auf weissem Hintergrund) - liefert dabei auch
  // gleich die Pixelmasse, die die Anlegen-Funktion zum Einbetten ins PDF braucht und die die
  // Vorschau zur Berechnung ihres Seitenverhaeltnisses nutzt.
  function imageFileToJpeg(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const maxDim = 2000;
        let { width, height } = img;
        if (Math.max(width, height) > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(
          (blob) => {
            URL.revokeObjectURL(url);
            if (!blob) return reject(new Error("Konnte Bild nicht konvertieren."));
            resolve({ blob, width, height });
          },
          "image/jpeg",
          0.85,
        );
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error("Datei konnte nicht als Bild gelesen werden."));
      };
      img.src = url;
    });
  }

  // Liest die Seitengroesse (MediaBox) direkt aus dem PDF-Bytestream - kein PDF-Parser noetig,
  // da der MediaBox-Eintrag bei den ueblichen einseitigen Scan-PDFs als reiner ASCII-Text im
  // Objektverzeichnis steht und daher auch nach einer latin1-Dekodierung des gesamten (teils
  // binaeren) Dateiinhalts unversehrt auffindbar ist. Liefert null, wenn nichts gefunden wird -
  // der Aufrufer faellt dann auf ein Standard-Seitenverhaeltnis zurueck.
  async function extractPdfPageSize(file) {
    try {
      const buf = await file.arrayBuffer();
      const text = new TextDecoder("latin1").decode(buf);
      const m = text.match(/\/MediaBox\s*\[\s*([\d.+-]+)\s+([\d.+-]+)\s+([\d.+-]+)\s+([\d.+-]+)\s*\]/);
      if (!m) return null;
      const width = Math.abs(parseFloat(m[3]) - parseFloat(m[1]));
      const height = Math.abs(parseFloat(m[4]) - parseFloat(m[2]));
      if (!width || !height) return null;
      return { width, height };
    } catch {
      return null;
    }
  }

  async function prepareFile(file) {
    if (file.type === "application/pdf") {
      const fileBase64 = await blobToBase64(file);
      const size = (await extractPdfPageSize(file)) || { width: 210, height: 297 };
      return {
        mimeType: "application/pdf",
        fileBase64,
        width: null,
        height: null,
        previewUrl: URL.createObjectURL(file),
        previewAspect: size.width / size.height,
      };
    }
    const { blob, width, height } = await imageFileToJpeg(file);
    const fileBase64 = await blobToBase64(blob);
    return {
      mimeType: "image/jpeg",
      fileBase64,
      width,
      height,
      previewUrl: URL.createObjectURL(blob),
      previewAspect: width / height,
    };
  }

  function euro(n) {
    return Number(n).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fieldRowHtml(id, label, field, inputHtml) {
    return `<div class="field-row"><label>${label}</label>${inputHtml}</div>`;
  }

  function addReceipt(file) {
    const r = {
      id: "r" + ++idCounter,
      seq: ++receiptCounter,
      file,
      status: "analysiere",
      prepared: null,
      previewUrl: null,
      previewAspect: null,
      buchungskontenOptionen: [],
      confidence: null,
      fields: { aussteller: "", datum: "", betrag: "", art: "expense", belegnummer: "", kurzbeschreibung: "", buchungskonto_nr: null },
      message: null,
      result: null,
    };
    receipts.unshift(r);
    renderList();
    runPipeline(r);
  }

  async function runPipeline(r) {
    try {
      const prepared = await prepareFile(r.file);
      r.prepared = prepared;
      r.previewUrl = prepared.previewUrl;
      r.previewAspect = prepared.previewAspect;
      if (openId === r.id) renderPreview();
    } catch (e) {
      r.status = "analyse_fehler";
      r.message = { type: "err", text: `Datei konnte nicht verarbeitet werden: ${e.message}` };
      renderList();
      return;
    }

    try {
      const resp = await fetch(ANALYSE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mimeType: r.prepared.mimeType, fileBase64: r.prepared.fileBase64 }),
      });
      const analyse = await resp.json();
      if (!resp.ok) throw new Error(analyse.error || `Fehler ${resp.status}`);
      r.status = "pruefen";
      r.buchungskontenOptionen = analyse.buchungskonten_optionen || [];
      r.confidence = analyse.confidence || "medium";
      r.fields = {
        aussteller: analyse.aussteller || "",
        datum: analyse.datum || "",
        betrag: analyse.betrag ?? "",
        art: analyse.art === "revenue" ? "revenue" : "expense",
        belegnummer: analyse.belegnummer || "",
        kurzbeschreibung: analyse.kurzbeschreibung || "",
        buchungskonto_nr: analyse.buchungskonto ? analyse.buchungskonto.nr : (r.buchungskontenOptionen[0] ? r.buchungskontenOptionen[0].nr : null),
      };
    } catch (e) {
      r.status = "analyse_fehler";
      r.message = { type: "err", text: `Analyse fehlgeschlagen: ${e.message}` };
    }
    renderList();
  }

  async function submitAnlegen(r) {
    r.status = "sende";
    r.message = null;
    renderList();

    const payload = {
      dateiname: r.file.name,
      mimeType: r.prepared.mimeType,
      fileBase64: r.prepared.fileBase64,
      width: r.prepared.width,
      height: r.prepared.height,
      aussteller: r.fields.aussteller,
      datum: r.fields.datum,
      betrag: parseFloat(r.fields.betrag),
      art: r.fields.art,
      belegnummer: r.fields.belegnummer,
      kurzbeschreibung: r.fields.kurzbeschreibung,
      buchungskonto_nr: parseInt(r.fields.buchungskonto_nr, 10),
    };

    try {
      const resp = await fetch(ANLEGEN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || `Fehler ${resp.status}`);
      r.status = "angelegt";
      r.result = result;
    } catch (e) {
      r.status = "anlegen_fehler";
      r.message = { type: "err", text: `Anlegen fehlgeschlagen: ${e.message}` };
    }
    renderList();
  }

  async function anlegenAlle() {
    const ready = receipts.filter((r) => r.status === "pruefen");
    if (ready.length === 0) return;
    anlegenAlleBtn.disabled = true;
    for (let i = 0; i < ready.length; i++) {
      anlegenAlleBtn.textContent = `Lege an (${i + 1}/${ready.length}) …`;
      await submitAnlegen(ready[i]);
    }
    anlegenAlleBtn.textContent = "Alles anlegen";
    updateAnlegenAlleButton();
  }

  function updateAnlegenAlleButton() {
    anlegenAlleBtn.disabled = receipts.length === 0;
  }

  function toggleOpen(id) {
    openId = openId === id ? null : id;
    renderList();
    renderPreview();
  }

  function statusPillHtml(status) {
    const map = {
      analysiere: "Analysiere …",
      pruefen: "Bitte prüfen",
      sende: "Wird angelegt …",
      angelegt: "Angelegt",
      analyse_fehler: "Fehler",
      anlegen_fehler: "Fehler",
    };
    return `<span class="beleg-status status-${status}">${map[status] || status}</span>`;
  }

  function rowBodyHtml(r) {
    const disabled = r.status === "sende" || r.status === "angelegt";
    const confidenceNote = r.confidence === "low"
      ? `<div class="confidence-low">Erkennung unsicher - Datum und Betrag bitte besonders genau prüfen.</div>`
      : "";

    if (r.status === "analyse_fehler") {
      return `<div class="row-body"><div class="row-msg err">${esc(r.message?.text || "Analyse fehlgeschlagen.")}</div></div>`;
    }

    const optionsHtml = r.buchungskontenOptionen
      .map((k) => `<option value="${k.nr}" ${k.nr === r.fields.buchungskonto_nr ? "selected" : ""}>${esc(k.name)} (${k.nr})</option>`)
      .join("");

    const fields = `
      ${fieldRowHtml(r.id, "Aussteller", "aussteller", `<input type="text" data-id="${r.id}" data-field="aussteller" value="${esc(r.fields.aussteller)}" ${disabled ? "disabled" : ""}>`)}
      ${fieldRowHtml(r.id, "Datum", "datum", `<input type="date" data-id="${r.id}" data-field="datum" value="${esc(r.fields.datum)}" ${disabled ? "disabled" : ""}>`)}
      ${fieldRowHtml(r.id, "Betrag (€)", "betrag", `<input type="number" step="0.01" min="0.01" data-id="${r.id}" data-field="betrag" value="${esc(r.fields.betrag)}" ${disabled ? "disabled" : ""}>`)}
      ${fieldRowHtml(r.id, "Art", "art", `<select data-id="${r.id}" data-field="art" ${disabled ? "disabled" : ""}>
          <option value="expense" ${r.fields.art !== "revenue" ? "selected" : ""}>Ausgabe</option>
          <option value="revenue" ${r.fields.art === "revenue" ? "selected" : ""}>Einnahme</option>
        </select>`)}
      ${fieldRowHtml(r.id, "Belegnummer", "belegnummer", `<input type="text" data-id="${r.id}" data-field="belegnummer" value="${esc(r.fields.belegnummer)}" placeholder="wird sonst automatisch vergeben" ${disabled ? "disabled" : ""}>`)}
      ${fieldRowHtml(r.id, "Beschreibung", "kurzbeschreibung", `<input type="text" data-id="${r.id}" data-field="kurzbeschreibung" value="${esc(r.fields.kurzbeschreibung)}" ${disabled ? "disabled" : ""}>`)}
      ${fieldRowHtml(r.id, "Buchungskonto", "buchungskonto_nr", `<select data-id="${r.id}" data-field="buchungskonto_nr" ${disabled ? "disabled" : ""}>${optionsHtml}</select>`)}
    `;

    let actions = "";
    if (r.status === "pruefen") {
      actions = `<div class="row-actions"><button class="btn" data-action="anlegen">Beleg + Buchung anlegen</button></div>`;
    } else if (r.status === "sende") {
      actions = `<div class="row-actions"><button class="btn" disabled>Lege an …</button></div>`;
    } else if (r.status === "anlegen_fehler") {
      actions = `<div class="row-actions"><button class="btn" data-action="anlegen">Erneut versuchen</button></div>`;
    }

    let message = "";
    if (r.status === "angelegt" && r.result) {
      message = `<div class="row-msg ok">Beleg (Invoice ${r.result.easyverein_invoice_id}) und Buchung (${euro(r.result.betrag)} € auf "${esc(r.result.buchungskonto)}") in Easyverein angelegt.</div>`;
    } else if (r.message) {
      message = `<div class="row-msg ${r.message.type}">${esc(r.message.text)}</div>`;
    }

    return `<div class="row-body">${confidenceNote}${fields}${actions}${message}</div>`;
  }

  function renderList() {
    updateAnlegenAlleButton();
    if (receipts.length === 0) {
      list.innerHTML = `<div id="list-empty">Noch keine Belege hochgeladen.</div>`;
      return;
    }
    list.innerHTML = receipts
      .map((r) => {
        const open = r.id === openId;
        const hint = r.status === "analysiere"
          ? `<div class="row-hint">Beleg wird gelesen und an Claude zur Analyse geschickt.</div>`
          : "";
        return `
          <div class="beleg-row ${open ? "open" : ""}" data-id="${r.id}">
            <div class="row-header">
              <div class="row-header-left">
                <span class="seq-badge">${r.seq}</span>
                <span class="row-filename">${esc(r.file.name)}</span>
              </div>
              ${statusPillHtml(r.status)}
            </div>
            ${open ? rowBodyHtml(r) : hint}
          </div>
        `;
      })
      .join("");
  }

  function renderPreview() {
    const r = receipts.find((x) => x.id === openId);
    if (!r || !r.previewUrl) {
      previewPane.classList.add("empty");
      previewPane.innerHTML = `<div>Beleg auswählen, um die Vorschau zu sehen.</div>`;
      return;
    }
    previewPane.classList.remove("empty");
    const aspect = r.previewAspect || 0.71;
    const style = `aspect-ratio:${aspect}; max-height:min(70vh,640px);`;
    if (r.prepared && r.prepared.mimeType === "application/pdf") {
      previewPane.innerHTML = `<embed type="application/pdf" src="${r.previewUrl}" style="${style}">`;
    } else {
      previewPane.innerHTML = `<img src="${r.previewUrl}" style="${style}" alt="Beleg-Vorschau">`;
    }
  }

  list.addEventListener("click", (e) => {
    const actionEl = e.target.closest("[data-action]");
    if (actionEl) {
      const row = actionEl.closest(".beleg-row");
      const r = receipts.find((x) => x.id === row.dataset.id);
      if (r && actionEl.dataset.action === "anlegen") submitAnlegen(r);
      return;
    }
    const header = e.target.closest(".row-header");
    if (header) {
      const row = header.closest(".beleg-row");
      toggleOpen(row.dataset.id);
    }
  });

  list.addEventListener("input", (e) => {
    const el = e.target;
    if (!el.dataset.field) return;
    const row = el.closest(".beleg-row");
    const r = receipts.find((x) => x.id === row.dataset.id);
    if (r) r.fields[el.dataset.field] = el.value;
  });

  renderList();
  renderPreview();
</script>
</body>
</html>
